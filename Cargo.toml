[workspace]
members = [
    "crates/capybara-core",
    "crates/capybara-wasm",
    "crates/capybara-cli",
    "crates/capybara-export",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
authors = ["PondPilot Team"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/keaidada/flowscope"

[workspace.dependencies]
capybara-core = { version = "2.0.0", path = "crates/capybara-core", default-features = false }
capybara-export = { version = "2.0.0", path = "crates/capybara-export", default-features = false }
sqlparser = "0.61"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
schemars = { version = "1.1", features = ["preserve_order"] }
wasm-bindgen = "0.2"
