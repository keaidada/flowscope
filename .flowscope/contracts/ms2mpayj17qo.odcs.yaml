{"content":"apiVersion: v3.1.0\nkind: DataContract\nid: ms2mpayj17qo_governance\nname: ms2mpayj17qo Governance\nversion: 1.0.0\nstatus: active\nschema: []\nsemantics: []\nreferences: []\nquality: []\nsla: null\nowners: []\ncustom:\n  flowscope:\n    lineage_rules:\n    - id: no_cross_layer\n      description: 禁止跨层依赖\n      forbidden_edges:\n      - - ODS\n        - DWS\n      - - ODS\n        - ADS\n      - - DWD\n        - ADS\n      severity: P1\n    - id: no_orphan_output\n      description: 产出表必须有下游消费\n      forbidden_edges: []\n      severity: P2\n    - id: lineage_completeness\n      description: 核心链路不能有血缘断裂\n      forbidden_edges: []\n      severity: P0\n    sql_rules:\n    - id: no_select_star\n      description: 生产脚本禁止 SELECT *\n      threshold: null\n      severity: P2\n    - id: no_update_without_where\n      description: UPDATE/DELETE 必须有 WHERE\n      threshold: null\n      severity: P0\n    - id: max_complexity\n      description: 单脚本复杂度不超过阈值\n      threshold: 80\n      severity: P2\n    metric_rules:\n    - id: no_duplicate_computation\n      description: 禁止重复计算\n      similarity_threshold: 0.85\n      severity: P1\n    - id: no_write_conflict\n      description: 禁止多个脚本写入同一物理表\n      similarity_threshold: 0.0\n      severity: P2\n    security_rules:\n    - id: no_hardcoded_secrets\n      description: SQL 中禁止硬编码密码/令牌\n      patterns:\n      - password\n      - token\n      - secret\n      - api_key\n      column_patterns: []\n      severity: P0\n    modeling_rules:\n    - id: naming_must_match_layer\n      description: 表名前缀必须与层级匹配\n      patterns:\n        ODS: ^ods_\n        DIM: ^dim_\n        DWD: ^dwd_\n        DWS: ^dws_\n        ADS: ^(ads_|app_)\n      forbidden_edges: []\n      severity: P2\n    - id: layer_must_be_assigned\n      description: 所有表必须有层级标注\n      patterns: {}\n      forbidden_edges: []\n      severity: P2\n"}